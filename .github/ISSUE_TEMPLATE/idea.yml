name: Idea
description: Something Sonora could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What you're trying to do, and how Sonora could help with it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In Sonora, SteelSeries GG, or anything else.
