name: CI

# Actions are pinned to exact commits (their version in the comment), so a
# moved or hijacked tag can't change what runs.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p app
      - run: cargo test --release --locked -p common -p app -p audio-engine --lib --bins
      - run: cargo clippy --release --locked -p app -p audio-engine

  linux:
    # The oldest supported base, as for releases.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libpulse-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p app
      - run: cargo test --release --locked -p common -p app -p audio-engine --lib --bins
      - run: cargo clippy --release --locked -p app -p audio-engine
