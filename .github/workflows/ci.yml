name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p app
      - run: cargo test --release --locked -p common -p app -p audio-engine --lib
      - run: cargo clippy --release --locked -p app -p audio-engine

  linux:
    # The oldest supported base, as for releases.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpulse-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p app
      - run: cargo test --release --locked -p common -p app -p audio-engine --lib
      - run: cargo clippy --release --locked -p app -p audio-engine
