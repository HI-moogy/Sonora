[package]
name = "app"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "sonar-rs"
path = "src/main.rs"

[dependencies]
audio-engine = { version = "0.1.0", path = "../audio-engine" }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "glow"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1.34"
