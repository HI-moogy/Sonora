[package]
name = "app"
version = "0.1.0-alpha.7"
edition.workspace = true
description = "A per-app audio mixer for Windows and Linux"
license = "MIT"
repository = "https://github.com/HI-moogy/Sonora"

[[bin]]
name = "sonora"
path = "src/main.rs"

[dependencies]
audio-engine = { version = "0.1.0", path = "../audio-engine" }
common = { version = "0.1.0", path = "../common" }
serde_json = "1.0.154"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "glow"] }

[target.'cfg(windows)'.dependencies]
# Clips (screen capture and encoding) are Windows-only for now.
capture-engine = { version = "0.1.0", path = "../capture-engine" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Windows on X11 (and XWayland) or Wayland.
eframe = { version = "0.37.0", default-features = false, features = ["x11", "wayland"] }
# To prefer X11, where a window can be hidden to the tray and shown again.
winit = { version = "0.30.13", default-features = false, features = ["x11"] }
# The tray icon (StatusNotifierItem, over D-Bus in pure Rust).
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

[build-dependencies]
winresource = "0.1.34"
