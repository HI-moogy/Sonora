[package]
name = "capture-engine"
version = "0.1.0"
edition.workspace = true

[dependencies]
bytes = "1"
mp4 = "0.14.0"
thiserror = "2.0.21"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_UI_Shell",
] }
windows-core = "=0.62.2"

[dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_HiDpi", "Win32_System_Com_StructuredStorage", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
